name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: "backend/**/packages.lock.json"
      - run: dotnet tool restore
      - run: dotnet restore CulinaryBlog.slnx --locked-mode
      - run: dotnet list CulinaryBlog.slnx package --vulnerable --include-transitive
      - run: dotnet format CulinaryBlog.slnx --verify-no-changes --no-restore
      - run: dotnet build CulinaryBlog.slnx --configuration Release --no-restore -warnaserror -p:RunAnalyzers=true
      - run: dotnet test tests/CulinaryBlog.UnitTests -c Release --no-build --no-restore --collect "XPlat Code Coverage" --results-directory ../artifacts/unit --logger trx
      - run: python ../scripts/test-application-coverage.py
      - run: python ../scripts/check-application-coverage.py ../artifacts/unit
      - run: dotnet test tests/CulinaryBlog.ArchitectureTests -c Release --no-build --no-restore --results-directory ../artifacts/architecture --logger trx
      - name: Build pinned MinIO test image
        run: docker build --tag culinary-blog-minio-test:2025-09-07-v2 --file ../infra/testing/minio.Dockerfile ../infra/testing
      - run: dotnet test tests/CulinaryBlog.IntegrationTests -c Release --no-build --no-restore --results-directory ../artifacts/integration --logger "trx;LogFileName=integration.trx"
        env:
          CULINARY_CONTRACT_OUTPUT: ${{ github.workspace }}/artifacts/openapi.json
      - run: python ../scripts/test-endpoint-matrix.py
      - run: python ../scripts/verify-endpoint-matrix.py --openapi ../artifacts/openapi.json --trx ../artifacts/integration/integration.trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: artifacts/

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: backend-verification
          path: artifacts/backend
      - name: Frontend gates with failure logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/frontend
          npm ci 2>&1 | tee ../artifacts/frontend/restore.log
          npm run generate:api 2>&1 | tee ../artifacts/frontend/api-generation.log
          npm run generate:users-api -- ../artifacts/backend/openapi.json
          git diff --exit-code -- src/lib/api/schema.d.ts src/lib/api/admin-users-schema.d.ts
          for gate in format lint typecheck build test test:components; do
            npm run "$gate" 2>&1 | tee "../artifacts/frontend/${gate//:/-}.log"
          done
          npm audit --audit-level=high 2>&1 | tee ../artifacts/frontend/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: artifacts/frontend/

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore backend/CulinaryBlog.slnx --locked-mode
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            tmp/package-G05/e2e/**/playwright.json
            tmp/package-G05/e2e/**/browser/
            tmp/package-G05/e2e/**/*.log
            tmp/package-G05/e2e/**/run.json
            tmp/package-G05/e2e/**/cleanup.json

  analyzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - run: dotnet restore backend/CulinaryBlog.slnx --locked-mode
      - run: dotnet restore tools/QualityAnalyzers/QualityAnalyzers.csproj --locked-mode
      - name: SonarAnalyzer and StyleCop (warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/test-srs-analyzers.py 2>&1 | tee artifacts/analyzer-controls.log
          dotnet build backend/CulinaryBlog.slnx -c Release --no-restore -warnaserror -t:Rebuild -p:CustomAfterMicrosoftCommonTargets="$GITHUB_WORKSPACE/scripts/srs-analyzers.targets" 2>&1 | tee artifacts/analyzers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyzer-results
          path: |
            artifacts/analyzers.log
            artifacts/analyzer-controls.log
            tmp/package-G05/analyzer-controls/**/*.log

  functional-browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: dotnet restore backend/CulinaryBlog.slnx --locked-mode
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:completion:e2e
        working-directory: frontend
        env:
          CULINARY_COMPLETION_RESULTS: ${{ github.workspace }}/artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-browser-verification
          path: |
            artifacts/browser/
            tmp/feature-e2e/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Verify UTC backup schedule and retry boundaries
        run: python scripts/test-backup-scheduler.py
      - name: Validate production release template
        shell: pwsh
        run: ./scripts/release-gate.ps1 -EnvFile infra/production/release.env.example -Template
      - run: docker compose build api web minio minio-bootstrap
      - name: Verify first startup with empty database and storage
        shell: bash
        run: |
          cp .env.example .env
          docker compose up --detach --no-build --wait nginx
          python scripts/check-local-startup.py http://localhost:8080
      - name: Collect startup diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100 postgres redis minio minio-bootstrap api web nginx
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down --volumes
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: culinary-blog-api:local
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: culinary-blog-web:local
          severity: HIGH,CRITICAL
          exit-code: 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNORED_LICENSES: LGPL-3.0-or-later,Apache-2.0 AND LGPL-3.0-or-later AND MIT,Apache-2.0 AND LGPL-3.0-or-later
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
