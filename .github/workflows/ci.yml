name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: "backend/**/packages.lock.json"
      - run: dotnet tool restore
      - run: dotnet restore CulinaryBlog.slnx --locked-mode
      - run: dotnet list CulinaryBlog.slnx package --vulnerable --include-transitive
      - run: dotnet format CulinaryBlog.slnx --verify-no-changes --no-restore
      - run: dotnet build CulinaryBlog.slnx --configuration Release --no-restore
      - run: dotnet test CulinaryBlog.slnx --configuration Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate production release template
        shell: pwsh
        run: ./scripts/release-gate.ps1 -EnvFile infra/production/release.env.example -Template
      - run: docker compose build api web
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: culinary-blog-api:local
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: culinary-blog-web:local
          severity: HIGH,CRITICAL
          exit-code: 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNORED_LICENSES: LGPL-3.0-or-later,Apache-2.0 AND LGPL-3.0-or-later AND MIT,Apache-2.0 AND LGPL-3.0-or-later
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
