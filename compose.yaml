name: culinary-blog

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culinary_blog}
      POSTGRES_USER: ${POSTGRES_USER:-culinary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culinary-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culinary-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-culinary-media}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc version enable "local/$${MINIO_BUCKET}"
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  seq:
    image: datalust/seq:2025.2@sha256:868a12e93ec0b8c993767a7dd4cd6c8ebc441511c79e4cfac66c911f62d4db65
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/CulinaryBlog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-culinary_blog};Username=${POSTGRES_USER:-culinary};Password=${POSTGRES_PASSWORD:-local-development-only}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-culinary-local}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-local-development-only}
      ObjectStorage__BucketName: ${MINIO_BUCKET:-culinary-media}
      Seq__ServerUrl: http://seq
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-development-only-change-this-key-before-shared-use}
      Google__ClientId: ${AUTH_GOOGLE_ID:-}
      Database__ApplyMigrationsOnStartup: "true"
      Email__Enabled: "true"
      Email__Host: mailhog
      Email__Port: "1025"
      AdminSeed__Enabled: ${ADMIN_SEED_ENABLED:-false}
      AdminSeed__Email: ${ADMIN_EMAIL:-}
      AdminSeed__Password: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      INTERNAL_API_BASE_URL: http://api:8080/api/v1
      AUTH_SECRET: ${AUTH_SECRET:-local-development-only-change-this-auth-secret}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:8080
      NEXTAUTH_URL: http://localhost:8080
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  seq-data:
