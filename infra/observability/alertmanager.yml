route:
  receiver: local-operations
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-operations

# Local alerts remain visible in Alertmanager. Staging/production must replace
# local-operations with the approved email, Slack, PagerDuty, or webhook receiver.
